<div class="stats-grid">
  @for (stat of stats(); track stat.label) {
    <mat-card appearance="outlined" class="stat-card" [attr.data-accent]="stat.accent">
      <div class="stat-header">
        <span class="stat-label">{{ stat.label }}</span>
        <mat-icon class="trend-icon" [class]="'trend-' + stat.trend">{{ trendIcon(stat.trend) }}</mat-icon>
      </div>
      <span class="stat-value">{{ stat.value }}</span>
    </mat-card>
  }
</div>

<section class="activity-section">
  <h2 class="section-title">Activity</h2>
  <div class="activity-list">
    @for (item of activities(); track item.target; let last = $last) {
      <div class="activity-row">
        <mat-icon class="activity-icon">{{ item.icon }}</mat-icon>
        <div class="activity-detail">
          <span class="activity-action">{{ item.action }}</span>
          <span class="activity-target">{{ item.target }}</span>
        </div>
        <span class="activity-time">{{ item.time }}</span>
      </div>
      @if (!last) {
        <mat-divider />
      }
    }
  </div>
</section>
